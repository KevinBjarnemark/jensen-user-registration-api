name: First workflow

on: push

jobs:
  first-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print text
        run: echo "This text is printed in GitHub actions."
      
      - name: Print date and time
        run: echo "The date and time is $(date +'%Y-%m-%d %H:%M:%S')"

      - name: List project files
        run: ls -la
